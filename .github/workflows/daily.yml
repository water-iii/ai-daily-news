name: AI Daily Digest

on:
  schedule:
    # Beijing time (UTC+8): primary run at 08:05, with four recovery attempts.
    - cron: '5 0 * * *'   # 08:05
    - cron: '35 0 * * *'  # 08:35
    - cron: '5 1 * * *'   # 09:05
    - cron: '35 1 * * *'  # 09:35
    - cron: '5 2 * * *'   # 10:05
  workflow_dispatch:
    inputs:
      force:
        description: 'Send even if today\'s digest has already been delivered'
        required: false
        type: boolean
        default: false

# Serialize scheduled, manual, and recovery runs to avoid duplicate sends.
concurrency:
  group: ai-daily-digest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check whether today's digest was already delivered
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const timezone = 'Asia/Shanghai';
            const today = new Intl.DateTimeFormat('en-CA', {
              timeZone: timezone,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).format(new Date());

            core.setOutput('date', today);

            const force = context.eventName === 'workflow_dispatch' &&
              String(context.payload.inputs?.force ?? 'false') === 'true';

            if (force) {
              core.setOutput('skip', 'false');
              core.notice('Force send requested; bypassing the daily delivery guard.');
              return;
            }

            const markerPath = 'state/last-delivery.json';
            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: markerPath,
                ref: 'main',
              });

              if (!Array.isArray(response.data) && response.data.content) {
                const state = JSON.parse(
                  Buffer.from(response.data.content, 'base64').toString('utf8')
                );

                if (state.date === today) {
                  core.setOutput('skip', 'true');
                  core.notice(`Today's digest was already delivered by run ${state.run_id}; skipping this retry.`);
                  return;
                }
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            core.setOutput('skip', 'false');
            core.info(`No successful delivery is recorded for ${today}; starting the digest pipeline.`);

      - name: Check out repository
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Collect, generate, and publish digest
        if: steps.guard.outputs.skip != 'true'
        run: python src/handler.py 24
        env:
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: '1'
          # LLM
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DIGEST_LANG: ${{ vars.DIGEST_LANG }}
          # Sources
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Publishers
          PUBLISHERS: ${{ vars.PUBLISHERS }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_API_BASE: ${{ secrets.WECHAT_API_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional
          ENABLE_CONTENT_FILTER: ${{ vars.ENABLE_CONTENT_FILTER }}
          DISABLE_AUDIO: ${{ vars.DISABLE_AUDIO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

      - name: Record successful delivery
        if: success() && steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          DELIVERY_DATE: ${{ steps.guard.outputs.date }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'state/last-delivery.json';
            const date = process.env.DELIVERY_DATE;
            const state = {
              date,
              delivered_at: new Date().toISOString(),
              run_id: context.runId,
              run_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`,
            };

            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: 'main',
              });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const params = {
              owner,
              repo,
              path,
              message: `chore: record AI digest delivery ${date}`,
              content: Buffer.from(JSON.stringify(state, null, 2) + '\\n').toString('base64'),
              branch: 'main',
            };
            if (sha) params.sha = sha;

            await github.rest.repos.createOrUpdateFileContents(params);
            core.notice(`Recorded successful Telegram delivery for ${date}.`);

      - name: Notify Telegram if the workflow fails
        if: failure() && steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELIVERY_DATE: ${{ steps.guard.outputs.date }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram credentials are unavailable; cannot send failure notification."
            exit 0
          fi

          curl --fail --silent --show-error --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ AI Daily Digest failed for ${DELIVERY_DATE}. Check the workflow: ${RUN_URL}" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
