name: AI Daily Digest

on:
  schedule:
    # China Standard Time (UTC+8): 08:05, 08:35, 09:05, 10:05.
    # Later runs act as retries if an earlier scheduled run was missed or failed.
    - cron: '5 0 * * *'
    - cron: '35 0 * * *'
    - cron: '5 1 * * *'
    - cron: '5 2 * * *'
  workflow_dispatch:

# Serialize runs so a retry cannot overlap the previous attempt.
concurrency:
  group: daily-digest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether today's digest was already delivered
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: python scripts/check_daily_delivery.py

      - name: Install dependencies
        if: steps.dedupe.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate and publish daily digest
        if: steps.dedupe.outputs.skip != 'true'
        run: python src/handler.py 24
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DIGEST_LANG: ${{ vars.DIGEST_LANG }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          PUBLISHERS: ${{ vars.PUBLISHERS }}
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
          WECHAT_API_BASE: ${{ secrets.WECHAT_API_BASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_CONTENT_FILTER: ${{ vars.ENABLE_CONTENT_FILTER }}
          DISABLE_AUDIO: ${{ vars.DISABLE_AUDIO }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
